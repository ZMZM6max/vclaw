[pytest]
testpaths = tests src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v --tb=short --log-cli-level=DEBUG
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    contract: Layer interface contract tests (adjacent layers)
    integration_real: Real dependency integration tests
    e2e_real: L1-L6 real end-to-end tests
    telegram_manual: Manual Telegram verification required
